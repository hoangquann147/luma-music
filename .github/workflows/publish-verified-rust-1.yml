name: Publish verified Luma Rust 1.0.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-verified-rust-1.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Luma-Rust-1.0.0-Windows
          run-id: 45433793426
          github-token: ${{ github.token }}
          path: desktop/artifacts
      - name: Recheck the previously built installer
        run: |
          $ErrorActionPreference='Stop'
          $hash=(Get-FileHash ./artifacts/Luma-Rust-1.0.0-x64-setup.exe).Hash.ToLowerInvariant()
          if($hash -ne '9c5caafec067c44ab025db9c87791e8ba2a33bb775864e0eca67dc2386ef968d'){throw 'Verified build checksum mismatch'}
          ./scripts/verify-installer.ps1 -Installer ./artifacts/Luma-Rust-1.0.0-x64-setup.exe
      - name: Publish the verified draft and delete the original portable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          $release=gh api "repos/$env:GH_REPO/releases/457022653" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Cannot read the verified release'}
          if($release.tag_name -ne 'rust-v1.0.0' -or $release.target_commitish -ne '03e5df085da8cc8bc7abfd02cdb0cf961fa8e76d'){throw 'Unexpected release identity'}
          $expected=@{
            'Luma-Rust-1.0.0-x64-setup.exe'='sha256:9c5caafec067c44ab025db9c87791e8ba2a33bb775864e0eca67dc2386ef968d'
            'SHA256SUMS.txt'='sha256:0f7eb2e8e085eb373670f62d846b0228ebec6acaa668f01a8f026128b97afc9c'
            'INSTALLER-VERIFICATION.json'='sha256:2eb6d25d1bd5321f009b07b44b9a0d7a51e286d0db71d4110e70be718761f887'
          }
          foreach($name in $expected.Keys){
            $asset=@($release.assets | Where-Object name -eq $name)
            if($asset.Count -ne 1 -or $asset[0].digest -ne $expected[$name]){throw "Release asset mismatch: $name"}
          }
          if($release.draft){
            gh api --method PATCH "repos/$env:GH_REPO/releases/457022653" -F draft=false -f make_latest=true
            if($LASTEXITCODE -ne 0){throw 'Cannot publish verified release'}
          }
          $published=gh api "repos/$env:GH_REPO/releases/457022653" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $published.draft -or $published.tag_name -ne 'rust-v1.0.0'){throw 'New release is not published; preserving old release'}
          $old=gh api "repos/$env:GH_REPO/releases/tags/desktop-v1.5.0" 2>$null
          if($LASTEXITCODE -eq 0){
            $old=$old | ConvertFrom-Json
            if($old.id -ne 433844286 -or $old.tag_name -ne 'desktop-v1.5.0'){throw 'Unexpected old release identity'}
            gh api --method DELETE "repos/$env:GH_REPO/releases/433844286"
            if($LASTEXITCODE -ne 0){throw 'Published new release, but deleting the original release failed'}
          }else{
            if($LASTEXITCODE -ne 1){throw 'Cannot inspect old release'}
          }
          Write-Output "Published $($published.html_url). Original portable release removed."
          exit 0
