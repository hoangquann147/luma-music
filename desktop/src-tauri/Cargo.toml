[package]
name = "luma-rust"
version = "1.0.0"
edition = "2021"
description = "Luma desktop music player, Rust backend with the original React interface"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
symphonia = { version = "0.5.5", features = ["all"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
lofty = "0.22"
rfd = "0.15"
sha2 = "0.10"
md5 = "0.7"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
url = "2"
regex = "1"
csv = "1"
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
wasapi = "0.23"
souvlaki = "0.8"
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
